<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Clark Zhou - editorial analytics GitHub profile hero</title>
  <desc id="desc">An editorial profile banner with a compact analytics dashboard for Clark Zhou, focused on computer science and AI agents.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="0.5" stop-color="#f4f0e7"/>
      <stop offset="1" stop-color="#e7f0ee"/>
    </linearGradient>
    <linearGradient id="ink" x1="110" y1="80" x2="620" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.62" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" stroke="#111827" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="0" fill="url(#paper)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <g opacity="0.9">
    <rect x="38" y="34" width="1124" height="352" stroke="#111827" stroke-opacity="0.18" stroke-width="1"/>
    <rect x="56" y="52" width="1088" height="316" stroke="#0f766e" stroke-opacity="0.34" stroke-width="1"/>
  </g>

  <g transform="translate(82 70)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#111827" fill-opacity="0.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3">
      PROFILE / COMPUTER SCIENCE / AI AGENT LAB
    </text>
    <line x1="0" y1="42" x2="1036" y2="42" stroke="#111827" stroke-opacity="0.22"/>
  </g>

  <g filter="url(#softShadow)">
    <text x="82" y="194" fill="url(#ink)" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" letter-spacing="0">
      Clark Zhou
    </text>
    <text x="86" y="244" fill="#0f172a" fill-opacity="0.74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="4">
      BSC COMPUTER SCIENCE AT CUHK(SZ)
    </text>
  </g>

  <g transform="translate(82 302)">
    <rect x="0" y="0" width="148" height="34" fill="#111827"/>
    <text x="18" y="22" fill="#fbfaf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">AI AGENTS</text>
    <rect x="164" y="0" width="166" height="34" fill="#0f766e"/>
    <text x="182" y="22" fill="#fbfaf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">VIBE CODING</text>
    <rect x="346" y="0" width="148" height="34" fill="#b45309"/>
    <text x="364" y="22" fill="#fff7ed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">BUILDING</text>
  </g>

  <g transform="translate(680 124)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="206" height="86" fill="#ffffff" fill-opacity="0.76" stroke="#111827" stroke-opacity="0.12"/>
    <text x="18" y="29" fill="#111827" fill-opacity="0.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">CURRENT FOCUS</text>
    <text x="18" y="61" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">AI Agents</text>

    <rect x="226" y="0" width="206" height="86" fill="#ffffff" fill-opacity="0.76" stroke="#111827" stroke-opacity="0.12"/>
    <text x="244" y="29" fill="#111827" fill-opacity="0.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">BUILD MODE</text>
    <text x="244" y="61" fill="#0f766e" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Prototype</text>

    <rect x="0" y="106" width="206" height="86" fill="#ffffff" fill-opacity="0.76" stroke="#111827" stroke-opacity="0.12"/>
    <text x="18" y="135" fill="#111827" fill-opacity="0.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">LEARNING</text>
    <text x="18" y="167" fill="#b45309" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Full Stack</text>

    <rect x="226" y="106" width="206" height="86" fill="#ffffff" fill-opacity="0.76" stroke="#111827" stroke-opacity="0.12"/>
    <text x="244" y="135" fill="#111827" fill-opacity="0.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">SIGNAL</text>
    <text x="244" y="167" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Shipping</text>
  </g>

  <g transform="translate(680 338)">
    <line x1="0" y1="0" x2="432" y2="0" stroke="#111827" stroke-opacity="0.18"/>
    <path d="M 0 20 L 52 12 L 104 18 L 156 4 L 208 14 L 260 7 L 312 9 L 364 -4 L 432 -12" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="12" r="4" fill="#0f766e"/>
    <circle cx="156" cy="4" r="4" fill="#0f766e"/>
    <circle cx="260" cy="7" r="4" fill="#0f766e"/>
    <circle cx="364" cy="-4" r="4" fill="#0f766e"/>
    <text x="0" y="39" fill="#111827" fill-opacity="0.46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">IDEA  CODE  TEST  LEARN  SHIP</text>
  </g>

  <text x="82" y="376" fill="#111827" fill-opacity="0.46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3">
    SHENZHEN / GITHUB.COM/CLARK-ZHOU / EDITORIAL DASHBOARD
  </text>
</svg>
